<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continuar</title>

  <!-- Script UTMify (ÚNICO script necessário) -->
  <script
    src="https://cdn.utmify.com.br/scripts/utms/latest.js"
    data-utmify-prevent-xcod-sck
    data-utmify-prevent-subids
    async
    defer>
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .box {
      max-width: 420px;
      width: 100%;
      background: #f9fff9;
      border-radius: 14px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    }

    h1 {
      color: #2e7d32;
      font-size: 1.6rem;
      margin-bottom: 16px;
    }

    .progress {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 5px;
      overflow: hidden;
      margin: 20px 0;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 60%;
      background: linear-gradient(90deg, #4caf50, #81c784);
    }

    p {
      font-size: 1rem;
      color: #555;
      margin-bottom: 28px;
    }

    a.button {
      display: block;
      background: linear-gradient(145deg, #4caf50, #2e7d32);
      color: #fff;
      text-decoration: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 1.15rem;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(76,175,80,0.4);
      transition: transform .2s ease;
    }

    a.button:hover {
      transform: scale(1.04);
    }

    .footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Tudo certo até aqui ✅</h1>

    <div class="progress">
      <span></span>
    </div>

    <p>Clique no botão abaixo para acessar as receitas completas.</p>

    <!-- LINK PARA A PÁGINA PRINCIPAL -->
    <a href="https://365receitascomovos.shop/" class="button">
      QUERO CONTINUAR
    </a>

    <div class="footer">
      🔒 Ambiente seguro • Em conformidade com a LGPD
    </div>
  </div>

</body>
</html>
